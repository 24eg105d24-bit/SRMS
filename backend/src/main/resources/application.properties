# Server Configuration (Binds to Render's dynamic PORT env variable, defaults to 8080 locally)
server.port=${PORT:8080}

# Application Name
spring.application.name=StudentRecordManagementSystem

# Datasource Configuration (Embedded H2 with file-based persistence)
# Saves database to ./data/srmsdb so records persist across application restarts
spring.datasource.url=jdbc:h2:file:./data/srmsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

